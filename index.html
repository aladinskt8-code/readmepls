<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Leitor de PDF</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1f4e79">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#eef1f4;--cd:#fff;--tx:#16202b;--mt:#5d6b7a;--ac:#1f4e79;--on:#fff;--bd:#d9e0e7;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f141a;--cd:#18202a;--tx:#e8edf2;--mt:#94a3b3;--ac:#7fb2e5;--on:#0b1722;--bd:#263140;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f141a;--cd:#18202a;--tx:#e8edf2;--mt:#94a3b3;--ac:#7fb2e5;--on:#0b1722;--bd:#263140;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
[hidden]{display:none!important}
#lib{max-width:900px;margin:0 auto;padding:18px 16px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
h1{font:600 24px/1.2 Georgia,"Iowan Old Style",serif;margin:0}
.btn{border:0;border-radius:999px;padding:11px 18px;font:inherit;font-weight:600;background:var(--ac);color:var(--on);cursor:pointer;display:inline-block}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.cv{aspect-ratio:3/4;width:100%;object-fit:cover;background:var(--bd);display:block;cursor:pointer}
.in{padding:10px 10px 12px}
.nm{font:600 15px/1.3 Georgia,"Iowan Old Style",serif;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;cursor:pointer}
.pr{font-size:12px;color:var(--mt);margin:5px 0 6px}
.bar{height:4px;border-radius:2px;background:var(--bd);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac)}
.acts{display:flex;gap:6px;margin-top:10px}
.acts button{flex:1;border:1px solid var(--bd);background:transparent;color:var(--mt);border-radius:8px;padding:7px 0;font:inherit;font-size:13px}
#empty{text-align:center;color:var(--mt);padding:70px 12px;font:17px/1.5 Georgia,"Iowan Old Style",serif}
#reader{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;background:#2b2d31;color:#eee}
.tb{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#1b1d21}
.tb:first-child{padding-top:calc(8px + env(safe-area-inset-top,0px))}
.bb{padding-bottom:calc(8px + env(safe-area-inset-bottom,0px))}
#rt{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font:600 16px Georgia,"Iowan Old Style",serif}
.rb{border:0;background:#383b41;color:#eee;border-radius:8px;padding:8px 12px;font:inherit;min-width:42px}
#st{flex:1;overflow:auto;display:flex;-webkit-overflow-scrolling:touch}
#st canvas{display:block;margin:auto;flex:none;background:#fff}
#st.night{background:#000}
#st.night canvas{filter:invert(1) hue-rotate(180deg)}
#sl{flex:1;min-width:0}
#pi{font-size:13px;min-width:64px;text-align:center}
#md,#bz{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:20px}
.box{background:var(--cd);color:var(--tx);border-radius:14px;padding:18px;width:100%;max-width:360px}
.box h3{margin:0 0 12px;font:600 18px/1.3 Georgia,"Iowan Old Style",serif}
.box input{width:100%;padding:12px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit;margin-bottom:14px}
.row{display:flex;gap:8px;justify-content:flex-end}
.btn.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}
#ts{position:fixed;left:16px;right:16px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:60;background:#222;color:#fff;padding:12px 14px;border-radius:10px;text-align:center}
</style>
</head>
<body>
<div id="lib">
  <header>
    <h1>Meus PDFs</h1>
    <label class="btn" for="file">Importar PDF</label>
    <input id="file" type="file" accept="application/pdf,.pdf" hidden>
  </header>
  <p id="wn" class="pr" hidden>Este navegador não deixou salvar os arquivos. Eles somem quando você fechar.</p>
  <div id="empty" hidden>Nenhum PDF ainda.<br>Toque em “Importar PDF”, escolha o arquivo e dê um nome.</div>
  <div id="grid"></div>
</div>

<div id="reader" hidden>
  <div class="tb"><button class="rb" id="bk" aria-label="Voltar à biblioteca">‹</button><div id="rt"></div></div>
  <div id="st"></div>
  <div class="tb bb">
    <button class="rb" id="zo" aria-label="Diminuir">A−</button>
    <button class="rb" id="zi" aria-label="Aumentar">A+</button>
    <input id="sl" type="range" min="1" max="1" value="1" aria-label="Página">
    <span id="pi"></span>
    <button class="rb" id="nt" aria-label="Modo noturno">🌙</button>
  </div>
</div>

<div id="md" hidden><div class="box"><h3 id="mt"></h3><input id="mi" type="text"><div class="row"><button class="btn g" id="mc">Cancelar</button><button class="btn" id="mo">OK</button></div></div></div>
<div id="bz" hidden><div class="box">Aguarde…</div></div>
<div id="ts" hidden></div>

<script src="pdf.min.js"></script>
<script>
const $=s=>document.querySelector(s);
let db=null,mem={m:new Map(),b:new Map()},pdf=null,cur=null,pg=1,zoom=1,tk=0,rt=null,night=false,tm,tt;
try{night=localStorage.getItem('night')==='1'}catch(e){}
if(window.pdfjsLib)pdfjsLib.GlobalWorkerOptions.workerSrc='pdf.worker.min.js';

const openDb=()=>new Promise(r=>{try{const q=indexedDB.open('leitor-pdf',1);q.onupgradeneeded=()=>{q.result.createObjectStore('m',{keyPath:'id'});q.result.createObjectStore('b')};q.onsuccess=()=>{db=q.result;r()};q.onerror=q.onblocked=()=>r()}catch(e){r()}});
const rq=r=>new Promise((ok,no)=>{r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const done=t=>new Promise((ok,no)=>{t.oncomplete=ok;t.onerror=t.onabort=()=>no(t.error)});
const S={
  async all(){return db?rq(db.transaction('m').objectStore('m').getAll()):[...mem.m.values()]},
  async meta(m){if(db)await rq(db.transaction('m','readwrite').objectStore('m').put(m));else mem.m.set(m.id,m)},
  async add(m,b){if(db){const t=db.transaction(['m','b'],'readwrite');t.objectStore('m').put(m);t.objectStore('b').put(b,m.id);await done(t)}else{mem.m.set(m.id,m);mem.b.set(m.id,b)}},
  async blob(id){return db?rq(db.transaction('b').objectStore('b').get(id)):mem.b.get(id)},
  async del(id){if(db){const t=db.transaction(['m','b'],'readwrite');t.objectStore('m').delete(id);t.objectStore('b').delete(id);await done(t)}else{mem.m.delete(id);mem.b.delete(id)}}
};

function toast(m){const t=$('#ts');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,4000)}
function busy(on){$('#bz').hidden=!on}
function ask(title,val,ok,input=true){
  return new Promise(res=>{
    const i=$('#mi');$('#mt').textContent=title;i.hidden=!input;i.value=val||'';$('#mo').textContent=ok;$('#md').hidden=false;
    if(input)setTimeout(()=>{i.focus();i.select()},60);
    const end=r=>{$('#md').hidden=true;res(r)};
    $('#mo').onclick=()=>end(input?i.value:true);
    $('#mc').onclick=()=>end(null);
    i.onkeydown=e=>{if(e.key==='Enter')end(i.value)};
  });
}

async function renderLib(){
  const l=(await S.all()).sort((a,b)=>b.t-a.t),g=$('#grid');
  g.replaceChildren();$('#empty').hidden=l.length>0;
  for(const m of l){
    const c=document.createElement('div');c.className='card';
    const im=document.createElement('img');im.className='cv';im.alt='';if(m.cover)im.src=m.cover;im.onclick=()=>openBook(m.id);
    const d=document.createElement('div');d.className='in';
    const n=document.createElement('div');n.className='nm';n.textContent=m.name;n.onclick=im.onclick;
    const p=document.createElement('div');p.className='pr';p.textContent='Página '+m.p+' de '+m.n;
    const b=document.createElement('div');b.className='bar';const i=document.createElement('i');i.style.width=Math.round(m.p/m.n*100)+'%';b.append(i);
    const a=document.createElement('div');a.className='acts';
    const r=document.createElement('button');r.textContent='Renomear';
    r.onclick=async()=>{const v=await ask('Novo nome',m.name,'Salvar');if(v&&v.trim()){m.name=v.trim();await S.meta(m);renderLib()}};
    const x=document.createElement('button');x.textContent='Excluir';
    x.onclick=async()=>{if(await ask('Excluir “'+m.name+'”?','','Excluir',false)){await S.del(m.id);renderLib()}};
    a.append(r,x);d.append(n,p,b,a);c.append(im,d);g.append(c);
  }
}

$('#file').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  const name=await ask('Nome do livro',f.name.replace(/\.pdf$/i,''),'Salvar');
  if(name===null)return;
  busy(1);
  try{
    if(!window.pdfjsLib){toast('Faltam os arquivos pdf.min.js e pdf.worker.min.js ao lado do index.html.');busy(0);return}
    const doc=await pdfjsLib.getDocument({data:new Uint8Array(await f.arrayBuffer())}).promise;
    const page=await doc.getPage(1),v0=page.getViewport({scale:1}),v=page.getViewport({scale:240/v0.width});
    const c=document.createElement('canvas');c.width=v.width;c.height=v.height;
    await page.render({canvasContext:c.getContext('2d'),viewport:v}).promise;
    await S.add({id:Date.now().toString(36),name:name.trim()||'Sem nome',n:doc.numPages,p:1,cover:c.toDataURL('image/jpeg',.7),t:Date.now()},f);
    doc.destroy();await renderLib();
  }catch(err){toast('Não consegui importar esse PDF. Se ele tem senha, ainda não dá para abrir.')}
  busy(0);
};

async function openBook(id){
  busy(1);
  try{
    if(!window.pdfjsLib)throw 0;
    cur=(await S.all()).find(m=>m.id===id);
    const bl=await S.blob(id);
    pdf=await pdfjsLib.getDocument({data:new Uint8Array(await bl.arrayBuffer())}).promise;
    pg=Math.min(Math.max(cur.p||1,1),pdf.numPages);zoom=1;
    $('#rt').textContent=cur.name;$('#sl').max=pdf.numPages;$('#st').className=night?'night':'';
    $('#reader').hidden=false;location.hash='leitor';
    await show(pg);
  }catch(e){toast('Não consegui abrir esse PDF.')}
  busy(0);
}

async function show(n){
  if(!pdf)return;
  n=Math.min(Math.max(n,1),pdf.numPages);pg=n;
  $('#sl').value=n;$('#pi').textContent=n+' / '+pdf.numPages;
  const id=++tk,st=$('#st');
  try{
    const page=await pdf.getPage(n),v1=page.getViewport({scale:1});
    const w=st.clientWidth*zoom,dpr=Math.min(window.devicePixelRatio||1,2);
    let s=w/v1.width*dpr;s=Math.min(s,Math.sqrt(16e6/(v1.width*v1.height)));
    const vp=page.getViewport({scale:s}),c=document.createElement('canvas');
    c.width=vp.width;c.height=vp.height;c.style.width=w+'px';c.style.height=(v1.height*w/v1.width)+'px';
    if(rt){try{rt.cancel()}catch(e){}}
    rt=page.render({canvasContext:c.getContext('2d'),viewport:vp});
    await rt.promise;
    if(id!==tk)return;
    st.style.overflowX=zoom>1?'auto':'hidden';
    st.replaceChildren(c);st.scrollTop=0;
    cur.p=pg;clearTimeout(tm);tm=setTimeout(()=>S.meta(cur).catch(()=>{}),400);
  }catch(e){if(id===tk&&e&&e.name!=='RenderingCancelledException')toast('Erro ao desenhar a página.')}
}
const go=d=>show(pg+d);

function closeReader(){
  if($('#reader').hidden)return;
  $('#reader').hidden=true;tk++;if(pdf){pdf.destroy();pdf=null}renderLib();
}
$('#bk').onclick=()=>{if(location.hash==='#leitor'){history.back();setTimeout(closeReader,300)}else closeReader()};
addEventListener('hashchange',()=>{if(location.hash!=='#leitor')closeReader()});

$('#zi').onclick=()=>{zoom=Math.min(3,zoom+.5);show(pg)};
$('#zo').onclick=()=>{zoom=Math.max(1,zoom-.5);show(pg)};
$('#nt').onclick=()=>{night=!night;$('#st').classList.toggle('night',night);try{localStorage.setItem('night',night?'1':'0')}catch(e){}};
$('#sl').oninput=e=>{if(pdf)$('#pi').textContent=e.target.value+' / '+pdf.numPages};
$('#sl').onchange=e=>show(+e.target.value);

let sx=0,sy=0,fingers=1;
const stg=$('#st');
stg.addEventListener('touchstart',e=>{fingers=e.touches.length;sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
stg.addEventListener('touchend',e=>{
  if(fingers>1||zoom>1)return;
  const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;
  if(Math.abs(dx)>60&&Math.abs(dx)>1.5*Math.abs(dy))go(dx<0?1:-1);
},{passive:true});
stg.addEventListener('click',e=>{const x=e.clientX/innerWidth;if(x<.33)go(-1);else if(x>.67)go(1)});
addEventListener('keydown',e=>{
  if($('#reader').hidden||!pdf)return;
  if(e.key==='ArrowRight'||e.key==='PageDown')go(1);
  if(e.key==='ArrowLeft'||e.key==='PageUp')go(-1);
});

(async()=>{
  await openDb();
  if(!db)$('#wn').hidden=false;
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  renderLib();
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
</body>
</html>
